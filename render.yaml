services:
  - type: web
    name: ac-erp-backend
    runtime: node
    rootDir: backend
    buildCommand: npm run render:build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_VERSION
        value: v1
      - key: APP_NAME
        value: AC ERP
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PUBLIC_LINK_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 24h
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: RATE_LIMIT_AUTH_MAX
        value: "10"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: LOG_FILE
        value: ./logs/erp.log
